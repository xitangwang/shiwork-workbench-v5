<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShiWork · 全工作台界面设计</title><style>
:root{--ink:#141414;--muted:#777;--accent:#ef4b32;--line:#e9e9e5}*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:#fafaf8}button,a,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{padding:22px 32px;border-bottom:1px solid var(--line);background:white;display:flex;align-items:center;justify-content:space-between;gap:24px}header img{width:180px;height:60px;object-fit:contain}header span{font-size:12px;color:var(--muted)}.hero{padding:36px 32px 18px;max-width:1600px;margin:auto}.hero h1{font-size:32px;letter-spacing:-1px;margin:0 0 10px}.hero p{color:var(--muted);margin:0;max-width:800px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:25px 0 0}.toolbar button{border:1px solid var(--line);background:white;padding:8px 13px;border-radius:4px;color:#555}.toolbar button.active{background:var(--accent);border-color:var(--accent);color:white}.toolbar input{margin-left:auto;border:1px solid var(--line);border-radius:4px;padding:9px 12px;background:white;min-width:240px}.count{padding:0 32px;color:#888;font-size:12px;max-width:1600px;margin:8px auto 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;max-width:1600px;margin:auto;padding:0 32px 50px}.card{background:white;border:1px solid var(--line);border-radius:5px;overflow:hidden;min-width:0}.preview{display:block;width:100%;border:0;border-bottom:1px solid var(--line);padding:0;background:#fff;aspect-ratio:1488/1058;position:relative}.preview img{display:block;width:100%;height:100%;object-fit:contain}.preview:hover{box-shadow:inset 0 0 0 2px var(--accent)}.preview .pending{position:absolute;inset:0;display:grid;place-content:center;color:#999;pointer-events:none}.caption{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.caption h2{font-size:17px;margin:0}.caption small{font-size:12px;color:#888}.caption a{font-size:12px;color:#b83825;text-decoration:none;white-space:nowrap}.id{font-size:11px;color:var(--accent);font-weight:500;margin-right:8px}footer{padding:20px 32px 40px;border-top:1px solid var(--line);font-size:12px;color:#777}dialog{border:0;padding:0;max-width:100vw;width:100vw;max-height:100vh;height:100vh;background:#f8f8f6;color:#111}dialog::backdrop{background:#0009}.viewer-head{height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 25px;border-bottom:1px solid var(--line);background:white}.viewer-head h2{font-size:18px;margin:0}.viewer-head small{font-size:12px;color:#777}.viewer-actions{display:flex;gap:10px;align-items:center}.viewer-actions button,.viewer-actions a{border:1px solid #ddd;background:white;color:#333;border-radius:4px;padding:6px 13px;text-decoration:none}.viewer-canvas{height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;overflow:auto;padding:14px}.viewer-canvas img{max-width:100%;max-height:100%;object-fit:contain;background:white;border:1px solid var(--line)}.viewer-canvas.zoom{display:block}.viewer-canvas.zoom img{max-width:none;max-height:none;width:1488px;height:auto}.empty{grid-column:1/-1;padding:60px;text-align:center;color:#777}[hidden]{display:none!important}@media(max-width:800px){header{padding:14px 20px}header img{width:145px;height:49px}.hero{padding:24px 20px 14px}.hero h1{font-size:25px}.toolbar input{margin-left:0;width:100%}.grid{grid-template-columns:1fr;padding:0 20px 30px;gap:20px}.count{padding:0 20px}.viewer-head{height:auto;min-height:90px;padding:12px;flex-wrap:wrap}.viewer-head h2{font-size:16px}.viewer-actions{gap:6px}.viewer-actions button,.viewer-actions a{padding:5px 9px;font-size:12px}.viewer-canvas{height:calc(100vh - 110px);padding:8px}.caption{padding:14px 16px}.hero p{font-size:13px}}
</style></head><body><header><img src="ShiWork-logo.png" alt="ShiWork"><span>界面设计图册 · 2026.10.15</span></header><section class="hero"><h1>一套风格，贯穿整个工作台。</h1><p>16 个主模块 · 10 张投流细分页面。沿用已确认的 Logo、黑白朱橙配色与左侧导航。点击任一界面，可放大查看或下载原图。</p><div class="toolbar" id="filters"></div></section><div id="count" class="count"></div><main class="grid" id="grid"></main><footer>由内置生图模型逐页生成的静态设计稿。图内公司、消息、金额、图片和连接状态均为示例；具体字段、流程及指标口径以产品设计文件为准。原型功能仍见现有工作台。生成文字与图标的细微差异需在实现时统一。</footer><dialog id="viewer" aria-labelledby="viewer-title"><div class="viewer-head"><div><h2 id="viewer-title"></h2><small id="viewer-index"></small></div><div class="viewer-actions"><button id="prev" aria-label="上一张">上一张</button><button id="next" aria-label="下一张">下一张</button><button id="zoom" aria-pressed="false">原尺寸</button><a id="download" download>下载原图</a><button id="close" aria-label="关闭预览">关闭</button></div></div><div class="viewer-canvas" id="canvas"><img id="large" alt=""></div></dialog><script>
const pages=[{"id": "M01", "title": "今日工作", "group": "总览", "brief": "Sidebar active 今日工作. Title “今天，把重要的事往前推。” Small date 10月15日 星期四. Main orange action “处理首要任务”. Three compact open summary numbers: 待处理 8 / 待审核 3 / 今日跟进 5. Main two-thirds “今日推进” worklist: 审核客户企业证据 / 补齐产品交付资料 / 审核设备选型内容 / 跟进已报价商机. Each row has object, owner, due time and subtle status. Right slim column “我的日程” with 14:00 技术方案评审, 16:30 客户跟进, and small “团队协作” 3 avatars. Selected first task in pale orange. Spacious working home, not metric card grid.", "file": "M01-今日工作.png"}, {"id": "M02", "title": "产品画像与知识", "group": "基础资料", "brief": "Sidebar active 产品资料. Title “产品事实，是所有工作的起点。” Local tabs 产品目录 / 买家画像 / 知识与FAQ / 待补资料. Main split: left category tree 台式设备 / 多槽设备 / 自动化设备; center selected 台式超声波清洗设备 with one tasteful small photoreal stainless steel machine image, product route description and attribute table 型号/适用工件/参数来源/审核状态. Do not invent certification or precise specs; several rows 待技术确认. Right facts panel “对外可用信息” 已核目录3项, 待补参数4项, latest document version and review owner. Orange “提交资料审核”. Small source document rows with date10月14日. No giant product hero.", "file": "M02-产品画像与知识.png"}, {"id": "M03", "title": "内容生产", "group": "内容", "brief": "Sidebar 内容 active, sublinks 内容生产 selected / 官网与渠道. Title “让产品知识，成为可用内容。” Orange “新建内容简报”. Local tabs 选题 / 制作中 / 待审核 / 内容库. Central draft editor selected “工业零件清洗：选型前先确认这3件事”, language 中文 with English variation toggle. Visible concise paragraphs about workpiece, contamination, capacity, plus a small genuine-looking industrial cleaning thumbnail. Left slim list of3 content drafts/status. Right “审核与依据” source product facts, risky claims待核, version V03, owner, and orange 提交审核 button if primary keep one dominant action. Single calm editorial production screen, not post-feed.", "file": "M03-内容生产.png"}, {"id": "M04", "title": "官网与渠道", "group": "内容", "brief": "Sidebar 内容 with 官网与渠道 selected. Title “内容发布，有计划也有回执。” Orange “安排发布”. Main October2026 week calendar 10/12周一 to10/18周日, today10/15周四 marked orange; sparse scheduled content pills for官网产品页 / 阿里产品资料 / LinkedIn图文. Below small publish log rows 草稿准备 / 待审核 / 待人工发布, no false published claims. Right panel selected “台式设备应用页” with small real website preview thumbnail, content version, language English, 询盘表单待核 and “检查发布清单”. Clear light calendar grid with whitespace.", "file": "M04-官网与渠道.png"}, {"id": "M05", "title": "找客任务", "group": "获客", "brief": "Sidebar 获客 expanded: 找客任务 selected / 背调审核 / 联系人 / 开发触达. Title “从一条线索，找到一批好客户。” Orange “新建找客任务”. Top three quiet route tabs A 同行反查 / B 种子扩展 / C 画像搜客 with A selected. Main horizontal workflow 输入供方→找历史买家→去重→企业审核. Center task detail '北美设备渠道商研究' with seed company fictional Northstar Cleaning, market美国, buyer渠道商; results table of4 fictional companies, country, historical trade evidence count, freshness and 待审核/需补查. Right task brief target, source scope and usage estimate. Historical trade explicitly not current demand. No scraped private contact details.", "file": "M05-找客任务.png"}, {"id": "M06", "title": "背调与审核", "group": "获客", "brief": "Sidebar 获客 expanded, 背调审核 selected. Title “有证据，再决定下一步。” Main evidence review split. Left compact company queue3, selected fictional Apex Components / 美国 / 待审核. Center enterprise profile and evidence list three documented entries: 官网产品目录, 历史贸易记录, 应用场景; each source label, observed2026-10-14, 已核/待核 status. One record conflict marked small ochre “主体关系待核”. Right decision panel 企业匹配 / 产品用途 / 采购角色 with clear 未确认 fields and short analyst note. Main orange “通过企业审核”, secondary 补查/排除. Footer says 通过企业审核后再准备找人. No ungrounded star scores or buyer certainty.", "file": "M06-背调与审核.png"}, {"id": "M07", "title": "联系人", "group": "获客", "brief": "Sidebar 获客 expanded, 联系人 selected. Title “找对角色，再核实联系信息。” Header selected company Apex Components · 企业审核已通过（示例）. Role tabs 采购 / 产品 / 技术. Main table of3 fictional contacts with name Alex Chen, Morgan Lee, Taylor Park, role,任职状态,来源,联系方式状态. No actual emails or phone numbers, show 邮箱待核. Selected row opens right detail 任职证据 / 职责匹配 / 地址核验 / 停联状态; orange “准备联系方式核验”. Small budget note 本次查询费用待确认. Do not present enrichment as already executed.", "file": "M07-联系人.png"}, {"id": "M08", "title": "开发触达", "group": "获客", "brief": "Sidebar 获客 expanded, 开发触达 selected. Title “每一次联系，都有具体理由。” Message composer: left3-step sequence 首次联系草稿 / 3天后跟进待定 / 回复后停止. Main email draft to Alex Chen · 采购角色待确认 with exact short English subject 'Ultrasonic cleaning product range'; body briefly cites category listing and asks correct contact, placeholders verified company/signature. Language English, status 待审核. Right sources and review checklist 事实依据 / 联系地址未核 / 人工审核待完成. Orange “提交草稿审核”; '发送准备' disabled. Quiet bottom stop rules 回复 / 退信 / 拒绝即停. Never show sent.", "file": "M08-开发触达.png"}, {"id": "M09", "title": "询盘接待", "group": "销售", "brief": "Sidebar 销售 expanded, 询盘接待 selected / 客户商机 / 方案报价 / 订单回款. Title “把每一次咨询，接得更准确。” Three-pane inbox: left conversations3 with channel badges 邮件 / WhatsApp导入, unread counts; central selected fictional buyer question in English 'Can this cleaner handle oily metal parts?' plus Chinese translation and two message bubbles timestamp10:20. Bottom editable suggested response asking workpiece size and contamination; label AI建议·未发送. Right extracted需求 工件尺寸待补/污染物油污/预计数量待补/采购时间待补, owner and takeover switch “人工接管”. Orange “保存回复草稿”. A subtle note 渠道尚未连接. Balanced readable messenger interface.", "file": "M09-询盘接待.png"}, {"id": "M10", "title": "客户与商机", "group": "销售", "brief": "Sidebar 销售 expanded, 客户商机 selected. Title “围绕一次需求，推进一次成交。” Orange “新建商机”. Kanban4 columns 需求澄清 / 方案评估 / 报价协商 / 待确认订单. 2,2,1,1 records respectively with fictional company, cleaning application, owner, next step/date; amount未确认 on early stages. Selected 'Apex · 零件除油' has compact pale orange focus. Right slim detail strip or bottom horizontal next-action panel with 需求待补2项 and 下一步安排试洗. Cards justified by distinct opportunities, simple white rectangles and fine borders, not excessive floating shadows.", "file": "M10-客户与商机.png"}, {"id": "M11", "title": "方案与报价", "group": "销售", "brief": "Sidebar 销售 expanded, 方案报价 selected. Title “把需求，变成可交付的方案。” Selected fictional Apex方案 / Q-20261015-01 / V03 draft. Center quote document table: 设备主体 1 $8,000; 配套篮筐 2 $100 each; 包装运输 待确认. Subtotal已确认项目 $8,200, 最终总额待确认. Sections terms 交期待技术确认 / 报价有效期待审核 / 贸易条款待确认. Right review panel 技术审核待处理 / 商务审核待处理 / 版本记录 V01,V02,V03, margin/cost未知. Orange “提交报价审核”, secondary preview. Do not show official sent quote or invented certifications.", "file": "M11-方案与报价.png"}, {"id": "M12", "title": "订单交付与回款", "group": "销售", "brief": "Sidebar 销售 expanded, 订单回款 selected. Title “从订单确认，到交付与回款。” Selected fictional order SO-202610-08 amount $8,500, example badge. Three open values 订单金额8,500 / 已收定金2,550 / 待收5,950, USD. Main horizontal milestone 订单确认10/08 completed / 生产准备10/12 completed / 出厂检验10/20 planned / 发货10/23 planned / 签收待定. Below two tabs 交付任务 / 收款记录; delivery task table with owner and planned dates. Right current exception “检验资料待补齐”, documents checklist and orange “更新交付进度”. Clearly planned future stages not completed. Revenue separate from cash.", "file": "M12-订单交付与回款.png"}, {"id": "M13", "title": "投流总览", "group": "投流", "brief": "Sidebar 投流 selected. Faithfully recreate approved reference composition: title “把投放，变成有效商机。” Orange 新建计划, date range, small 示例数据. Horizontal local tabs 总览/预算/计划/素材/询盘/复盘/更多. Open five metrics 期间预算$4,309 / 媒体消耗$1,307 / 询盘9 / 合格需求2 / 期间订单3. Label orders 按订单日，非同期转化率. Thin budget progress30.3%, remaining$3,002 (rounded). Lower left 4 plan list, 阿里渠道 and Google entries spend389.00 /303.42 /357.88 /256.74 totals1307.04. Right next-action “审核4条新询盘” and smaller 素材检查、预算复盘. Use no fake conversion rate or income derived from orders.", "file": "M13-投流总览.png"}, {"id": "M14", "title": "生意看板", "group": "经营", "brief": "Sidebar 经营 selected. Title “看清投入，也看清回来的钱。” Business switch 超声设备 active / 游戏代理待配置. Period10月截至10/14, 示例数据. Four open values 订单15,500 / 确认收入4,000 / 现金到账4,100 / 媒体消耗1,307.04, USD; visibly independent measures not additive. Main comparison bars 订单/收入/现金 with labels, not misleading single funnel. Below channel contribution table 询盘/合格/关联订单, 未知归因 separate. Right '需要先核实' missing成本、收入规则、归因 and orange “查看经营异常”. Compact note 成本未齐，不计算净利润. White professional operating review.", "file": "M14-生意看板.png"}, {"id": "M15", "title": "账号与数据接入", "group": "设置", "brief": "Sidebar 设置 selected, sublinks 账号与数据 / 流程权限. Title “每份数据，都能追到来源。” Orange “导入数据”. Main tabs 来源清单 / 导入记录 / 字段映射 / 数据质量. Source rows 阿里投流报表—待导入, Google Ads—未核账号, 邮箱—未连接, WhatsApp—未连接, ERP订单—文件导入准备. Right selected report import mapping table 原始字段→统一字段: 日期→date, 消耗→platformSpend, 计划ID→campaignId, 币种→currency. Small stepper 上传文件→字段映射→校验→确认导入 with mapping active. Show2 errors待修正 and preview5rows label, no secrets or false green connected status.", "file": "M15-账号与数据接入.png"}, {"id": "M16", "title": "流程权限与运行", "group": "设置", "brief": "Sidebar 设置 expanded, 流程权限 selected. Title “让自动化，始终有边界。” Local tabs 审核规则 / 角色权限 / 运行记录. Main simple horizontal workflow 内容草稿→业务审核→技术审核→发布准备, human approval nodes with owner labels. Selected rule 报价发送前必须人工审核, switch开启, scope超声设备业务. Lower role table 业务员/技术/负责人 with read/edit/approve columns, restrained checks. Right recent audit events 草稿创建/审核退回/人工接管, timestamps10/15. Orange “保存规则草稿”; note 生效需负责人确认. Visible pause running task secondary button, no uncontrolled autonomous actions.", "file": "M16-流程权限与运行.png"}, {"id": "M13-01", "title": "计划管理", "group": "投流深化", "brief": "Sidebar 投流 active. Local tabs 总览/预算/计划(active)/素材/询盘/复盘/更多. Title “让每个计划，都有清晰目标。” Orange 新建计划. Filters 渠道/市场/状态. Main professional 4-row plan table: 台式设备渠道·美国; 实验室仪器渠道·印度; 型号选型内容·巴西; 工业清洗应用·乌兹别克. Columns channel 阿里 or Google, owner, 日预算, 当前阶段 草稿/待审核/示例观察, 媒体消耗. Selected row details right: campaign native hierarchy/account ID as masked demo values, target buyer, product, current hypothesis and planned review10/19. Clear no live-account claims.", "file": "M13-01-计划管理.png"}, {"id": "M13-02", "title": "预算节奏与审批", "group": "投流深化", "brief": "Sidebar 投流, 预算 active. Title “预算跟着验证走。” Orange 新建预算草案. Top open metrics 期间预算$4,309 / 已消耗$1,307.04 / 余额$3,001.96. Large simple two-line cumulative chart 日期10/1–10/14, gray预算节奏 vs orange实际消耗, meaningful axes and gentle clean lines. Lower budget allocation table3rows and right selected version drawer '北美计划预算 V02' with 原日预算$40 / 拟日预算$50, reason field, state待审核. Four-step status 草案→批准→人工执行登记→复盘, only草案 current. Button 提交预算审核; no live changes.", "file": "M13-02-预算节奏与审批.png"}, {"id": "M13-03", "title": "素材实验", "group": "投流深化", "brief": "Sidebar 投流, 素材 active. Title “用一个实验，回答一个问题。” Orange 新建素材实验. Experiment title 工件对比图能否带来更明确需求？ Two side-by-side creative variants with professional industrial photo thumbnails: A dirty/clean metal part comparison; B ultrasonic cleaner in operation. Each image small enough to leave metric rows below: impressions,clicks,询盘,合格需求; short sample labels and status观察中. No premature winner. Below one hypothesis and review criteria strip 样本不足，继续观察. Right narrow task panel 待补用途标签/核落地页一致性/安排复盘10月19日, link 转内容制作任务.", "file": "M13-03-素材实验.png"}, {"id": "M13-04", "title": "关键词与搜索词", "group": "投流深化", "brief": "Sidebar 投流, 更多 section 关键词与搜索词 active. Title “看懂搜索意图，再决定取舍。” Main table with distinct 投放关键词 vs 实际搜索词 columns, 5 rows industrial ultrasonic cleaner / ultrasonic parts washer / cleaner repair manual / household jewelry cleaner / industrial degreasing machine. Other columns spend,询盘,相关性. Orange selection on irrelevant household query. Right proposed negative panel '否词草案', match精准, scope示例计划, reason需求不符, impact待检查, button 提交否词审核. Clearly 草案尚未执行. Filters渠道/计划/期间 and small unknown unlinked inquiry count. No fake auto blocking.", "file": "M13-04-关键词与搜索词.png"}, {"id": "M13-05", "title": "市场与受众", "group": "投流深化", "brief": "Sidebar 投流, 更多 市场与受众 selected. Title “找到值得继续投入的市场。” Left-to-right grouped comparison of3 markets 美国渠道商 / 巴西品牌 / 印度实验室: horizontal bars of qualified leads1/2/1 with spend values. No decorative world globe/map. Lower table separating buyer role渠道采购 vs 工业终端, spend/询盘/合格/未审核, 未知角色 separate. Right focus market detail 需要核查的用途, sample count small, action “创建市场复盘任务”. White editorial table-driven screen; don't promise certain demand from region alone.", "file": "M13-05-市场与受众.png"}, {"id": "M13-06", "title": "落地页与表单", "group": "投流深化", "brief": "Sidebar 投流, 更多 落地页 selected. Title “让点击，顺利到达询盘。” Main selected English industrial cleaner landing-page preview at left, not full website: actual small equipment image, clear heading Industrial parts cleaning and Request application review form. To right diagnostic checklist 页面语言/产品一致性/表单回执/需求字段/去重, status待核. Bottom mini path 广告点击→页面访问→表单提交→独立询盘 with numbers only clicks160, sessions未知, submissions5, inquiry dedup4. Explicit missing session data no fabricated rate. Orange “创建页面检查任务”. Page version LP-V03, test timestamp待执行.", "file": "M13-06-落地页与表单.png"}, {"id": "M13-07", "title": "询盘质量审核", "group": "投流深化", "brief": "Sidebar 投流, 询盘 active. Title “先核实需求，再判断流量价值。” Main queue table with4 fictional companies and sourceplan/receiveddate/reviewstatus, selected Apex Components 待审核. Right wide review detail original English inquiry about oily steel parts + Chinese translation; separate fields 处理进度,业务匹配,具体需求确认,重复状态,下一步. Selected values 已审核/相关/待确认/唯一记录; outcome 待补资料, NOT automatically qualified. Orange 保存质量判断. Top counts 入站9/待审核4/合格2, example labels. Footer link转销售跟进. Usable form, generous readable labels.", "file": "M13-07-询盘质量审核.png"}, {"id": "M13-08", "title": "销售归因与回传", "group": "投流深化", "brief": "Sidebar 投流, 更多 销售归因 selected. Title “把成交，追溯到有依据的来源。” Policy dropdown人工确认/首次/末次/均分 with人工确认 selected; period vs询盘批次 switch. Main linked row/timeline selected inquiry L-003→opportunity O-02→order SO-08→recognizedrevenue and cash, visually distinguish amounts. Table plans with attribution weights60%/40% for one $10,000 example order; allocated6000+4000=10000. Separate 未知归因 row for unrelated record. Right 回传准备 checklist consent/identifier/eventid/去重, all 待核, status未发送, button “准备回传草稿”. No imply API connected.", "file": "M13-08-销售归因与回传.png"}, {"id": "M13-09", "title": "优化任务与复盘", "group": "投流深化", "brief": "Sidebar 投流, 复盘 active. Title “每次调整，都留下复盘依据。” Main task board four stages 待审核 / 待执行 / 待复盘 / 已复盘 with one or two clean tasks each. Selected task '核查表单回执' in待复盘. Right detail narrow panel original signal高点击低入站, evidence sample date, owner, manual execution note, observation window10/12–10/19未结束, conclusion待观察. Orange 保存复盘记录, no assert proven cause or automatically increased spend. Bottom tiny audit row改动版本与操作者. All same flat white/black/orange system.", "file": "M13-09-优化任务与复盘.png"}, {"id": "M13-10", "title": "账户与数据健康", "group": "投流深化", "brief": "Sidebar 投流, 更多 数据健康 active. Title “先把数据对齐，再做投放判断。” Top restrained data status row 报表覆盖待核 / 字段缺口3 / 关联缺口2. Main source health list 阿里报表待导入, Google账号未确认, CRM线索待映射, 订单待关联, 回传未配置; status gray/ochre, no fake green connection. Right selected import check details missingcurrency, duplicateeventid, unknownplanid, sample rows highlighted lightly. Small synchronization timeline 仅演示记录. Orange “查看导入修复清单”. Account permissions只读待确认, credential values never shown.", "file": "M13-10-账户与数据健康.png"}];let group='全部',query='',visible=pages,current=0;const $=id=>document.getElementById(id);const groups=['全部','总览','基础资料','内容','获客','销售','投流','投流深化','经营','设置'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const src=p=>'界面图/'+p.file;
function render(){visible=pages.filter(p=>(group==='全部'||p.group===group)&&(!query||(p.id+' '+p.title).toLowerCase().includes(query.toLowerCase())));$('count').textContent='显示 '+visible.length+' / '+pages.length+' 张';$('grid').innerHTML=visible.map(p=>'<article class="card"><button class="preview" data-id="'+p.id+'" aria-label="放大 '+esc(p.title)+'"><img loading="lazy" src="'+esc(src(p))+'" alt="'+esc(p.title)+'界面设计" onload="this.nextElementSibling.hidden=true" onerror="this.hidden=true"><span class="pending">界面图正在生成</span></button><div class="caption"><div><h2><span class="id">'+p.id+'</span>'+esc(p.title)+'</h2><small>'+esc(p.group)+'</small></div><a href="'+esc(src(p))+'" download>下载原图</a></div></article>').join('')||'<div class="empty">没有找到对应界面。</div>';document.querySelectorAll('[data-group]').forEach(b=>b.classList.toggle('active',b.dataset.group===group))}
$('filters').innerHTML=groups.map(g=>'<button data-group="'+g+'" class="'+(g==='全部'?'active':'')+'">'+g+'</button>').join('')+'<input id="search" type="search" placeholder="搜索模块或编号…" aria-label="搜索界面">';$('filters').addEventListener('click',e=>{if(e.target.dataset.group){group=e.target.dataset.group;render()}});$('search').addEventListener('input',e=>{query=e.target.value;render()});function show(id){current=pages.findIndex(p=>p.id===id);const p=pages[current];$('large').src=src(p);$('large').alt=p.title+'界面设计';$('viewer-title').textContent=p.id+' · '+p.title;$('viewer-index').textContent=(current+1)+' / '+pages.length+' · '+p.group;$('download').href=src(p);$('download').download=p.file;$('canvas').classList.remove('zoom');$('zoom').setAttribute('aria-pressed','false');$('zoom').textContent='原尺寸';if(!$('viewer').open)$('viewer').showModal();history.replaceState(null,'','#'+p.id)}function step(n){show(pages[(current+n+pages.length)%pages.length].id)}$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)show(b.dataset.id)});$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('close').onclick=()=>$('viewer').close();$('zoom').onclick=()=>{const z=$('canvas').classList.toggle('zoom');$('zoom').setAttribute('aria-pressed',String(z));$('zoom').textContent=z?'适应窗口':'原尺寸'};document.addEventListener('keydown',e=>{if(!$('viewer').open)return;if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}});render();if(pages.some(p=>p.id===location.hash.slice(1)))show(location.hash.slice(1));
</script></body></html>
